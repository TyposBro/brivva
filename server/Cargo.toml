[package]
name = "brivva-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "brivva_server"
path = "src/lib.rs"

[[bin]]
name = "brivva-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
thiserror = "1.0"
serde_json = "1.0"

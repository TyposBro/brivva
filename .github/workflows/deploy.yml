name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-deploy from the Actions tab

concurrency:
  group: deploy-main
  cancel-in-progress: false # serialize deploys — don't cancel a mid-flight one

jobs:
  # Re-run the CI gate so we never ship unreviewed/failed code even if a
  # concurrent CI pass was canceled by a new push.
  gate:
    name: Pre-deploy CI gate
    uses: ./.github/workflows/ci.yml

  deploy-workers:
    name: Workers → brivva-api
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # wrangler reads CLOUDFLARE_API_TOKEN from env. The token must have
      # Workers Scripts: Edit + D1 Edit for the brivva account.
      - name: wrangler deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: apply D1 migrations
        run: bun run migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Pages → brivva.pages.dev
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: production build
        run: bun run build

      - name: wrangler pages deploy
        run: bunx wrangler pages deploy dist --project-name=brivva --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-fargate:
    name: Fargate → us-east-1
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com

      # Graviton ARM64 image. Buildx uses QEMU on GH's amd64 runner which is
      # slow but correct — swap to a self-hosted arm64 runner later for speed.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server-rs
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com/brivva/server-rs:latest \
            -f server-rs/Dockerfile \
            --push .

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --region us-east-1 \
            --cluster brivva \
            --service brivva \
            --force-new-deployment \
            --query 'service.taskDefinition' --output text

      - name: Wait for ECS to stabilize
        run: aws ecs wait services-stable --region us-east-1 --cluster brivva --services brivva

      - name: Smoke-test the tunnel
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -m 10 https://brivva.spiko.uz/)
          echo "probe http=$code"
          test "$code" = "200"

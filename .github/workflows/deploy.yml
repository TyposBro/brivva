name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch: # manual re-deploy from the Actions tab

concurrency:
  group: deploy-prod
  cancel-in-progress: false # serialize deploys — don't cancel a mid-flight one

jobs:
  # Re-run the CI gate so we never ship unreviewed/failed code even if a
  # concurrent CI pass was canceled by a new push.
  gate:
    name: Pre-deploy CI gate
    uses: ./.github/workflows/ci.yml

  deploy-workers:
    name: Workers → brivva-api
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # wrangler reads CLOUDFLARE_API_TOKEN from env. The token must have
      # Workers Scripts: Edit + D1 Edit for the brivva account.
      - name: wrangler deploy
        run: bun run --cwd workers deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: apply D1 migrations
        run: bun run --cwd workers migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Pages → brivva.pages.dev
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: production build
        run: bun run --cwd frontend build

      - name: wrangler pages deploy
        run: bunx wrangler pages deploy frontend/dist --project-name=brivva --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-fargate:
    name: Fargate → us-east-1
    needs: gate
    # Build and run x86_64 so production ffmpeg behavior matches Ubuntu dev.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write   # required for docker/build-push-action cache-to=type=gha
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPO: brivva/server-rs
      FFMPEG_BASE_REPO: brivva/ffmpeg-base
      FFMPEG_VERSION: "7.1.1"
      SERVER_BUILD_BASE_REPO: brivva/server-build-base
      SERVER_BUILD_BASE_TAG: rust-1.88-slim-zigbuild-v1
      SERVER_RUNTIME_BASE_REPO: brivva/server-runtime-base
      SERVER_RUNTIME_BASE_TAG: bookworm-ffmpeg-7.1.1-v1
      ECS_CLUSTER: brivva
      ECS_SERVICE: brivva
      ECS_CONTAINER: server-rs
      TASK_FAMILY: brivva
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/github-actions-deploy
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # ffmpeg-base changes rarely and is built by ffmpeg-base.yml or
      # `./deploy.sh --build-ffmpeg-base`. Normal deploys only verify the
      # pinned ECR tag exists, then server-rs pulls it during its Docker build.
      - name: Verify ffmpeg-base image exists
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --region us-east-1 \
            --repository-name "${FFMPEG_BASE_REPO}" \
            --image-ids imageTag="${FFMPEG_VERSION}-librtmp" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt}' \
            --output table

      - name: Verify server base images exist
        run: |
          set -euo pipefail
          for image in \
            "${SERVER_BUILD_BASE_REPO}:${SERVER_BUILD_BASE_TAG}" \
            "${SERVER_RUNTIME_BASE_REPO}:${SERVER_RUNTIME_BASE_TAG}"
          do
            repo="${image%:*}"
            tag="${image##*:}"
            aws ecr describe-images \
              --region us-east-1 \
              --repository-name "$repo" \
              --image-ids imageTag="$tag" \
              --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt}' \
              --output table
          done

      # Native amd64 build — runner, Rust target, ffmpeg base, final
      # image all share linux/amd64 so BuildKit never invokes QEMU.
      #
      # SERVER_BUILD_BASE_IMAGE pins Rust/cargo-zigbuild tooling.
      # SERVER_RUNTIME_BASE_IMAGE pins Debian runtime libs, CJK fonts, and
      # the custom FFmpeg binary. Rebuild those through server-base.yml
      # only when the pinned tags or Dockerfiles change.
      #
      # Keep both GitHub Actions and ECR registry caches. The registry cache
      # makes warm cargo-chef layers durable even if the GitHub cache misses.
      - name: Build and push server-rs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-rs/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SERVER_BUILD_BASE_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.SERVER_BUILD_BASE_REPO }}:${{ env.SERVER_BUILD_BASE_TAG }}
            SERVER_RUNTIME_BASE_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.SERVER_RUNTIME_BASE_REPO }}:${{ env.SERVER_RUNTIME_BASE_TAG }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-from: |
            type=gha,scope=server-rs
            type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=server-rs
            type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # Register an immutable task-def revision pinning image:<sha>.
      # Enables rollback to a prior revision via ./scripts/rollback.sh.
      - name: Register new task definition
        id: taskdef
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${GITHUB_SHA}"
          aws ecs describe-task-definition \
            --region us-east-1 \
            --task-definition "${TASK_FAMILY}" \
            --query 'taskDefinition' \
            --output json \
          | jq --arg IMG "$IMAGE" --arg C "$ECS_CONTAINER" '
              .containerDefinitions |= map(
                if .name == $C then .image = $IMG else . end
              )
              | {family, networkMode, taskRoleArn, executionRoleArn,
                 containerDefinitions, volumes, placementConstraints,
                 requiresCompatibilities, cpu, memory, runtimePlatform, ephemeralStorage}
              | .runtimePlatform = {
                  operatingSystemFamily: "LINUX",
                  cpuArchitecture: "X86_64"
                }
              | with_entries(select(.value != null))
            ' > taskdef.json
          REV=$(aws ecs register-task-definition \
            --region us-east-1 \
            --cli-input-json file://taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "registered $REV"

      - name: Update ECS service → new revision
        run: |
          aws ecs update-service \
            --region us-east-1 \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${{ steps.taskdef.outputs.revision }}" \
            --query 'service.taskDefinition' --output text

      # Circuit breaker (configured on the service) auto-rolls back to the
      # previous revision if new tasks fail to reach steady state.
      - name: Wait for ECS to stabilize
        run: aws ecs wait services-stable --region us-east-1 --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}"

      - name: Smoke-test the tunnel
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -m 10 https://brivva.spiko.uz/)
          echo "probe http=$code"
          test "$code" = "200"

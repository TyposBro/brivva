name: ffmpeg-base

# Prebuilds the amd64 ffmpeg image with native RTMP/RTMPS and pushes to
# ECR. Downstream `server-rs/Dockerfile` COPYs the binary out instead of
# compiling ffmpeg on every deploy (which was a 2+hr QEMU build on the
# amd64 runner; 2026-04-20 incident).
#
# Rebuild triggers:
#   - any change to infra/ffmpeg-base/** (Dockerfile bump, libs change)
#   - manual via workflow_dispatch
#
# The image is content-addressed by the FFMPEG_VERSION input (default
# 7.1.1) plus the `-native-rtmp` suffix. Never overwrite a version tag in
# place — bump FFMPEG_VERSION when the underlying ffmpeg changes so
# every downstream server-rs image pins a known binary.

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "ffmpeg source version to build (must match upstream release tarball)"
        required: false
        default: "7.1.1"
  push:
    branches: [prod, main]
    paths:
      - "infra/ffmpeg-base/**"
      - ".github/workflows/ffmpeg-base.yml"

concurrency:
  group: ffmpeg-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build + push ffmpeg-base → ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPO: brivva/ffmpeg-base
      FFMPEG_VERSION: ${{ github.event.inputs.ffmpeg_version || '7.1.1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/github-actions-deploy
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # Build amd64 so ffmpeg behavior matches Ubuntu dev and x86_64 Fargate.
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: infra/ffmpeg-base
          file: infra/ffmpeg-base/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FFMPEG_VERSION=${{ env.FFMPEG_VERSION }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.FFMPEG_VERSION }}-native-rtmp
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-from: type=gha,scope=ffmpeg-base
          cache-to: type=gha,mode=max,scope=ffmpeg-base

      - name: Verify published manifest
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --region us-east-1 \
            --repository-name "${ECR_REPO}" \
            --image-ids imageTag="${FFMPEG_VERSION}-native-rtmp" \
            --query 'imageDetails[0].{digest:imageDigest,size:imageSizeInBytes,pushed:imagePushedAt}' \
            --output table

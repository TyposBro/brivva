name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_call: {}

# Concurrency: a new push to the same branch cancels the in-flight run so
# CI never queues stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (generated types drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: regenerate Rust bindings from OpenAPI
        run: bun run contracts:gen-rust

      - name: fail if regeneration produced a diff
        run: |
          if ! git diff --exit-code server-rs/src/core/contracts/; then
            echo "::error::server-rs/src/core/contracts is out of sync with contracts/openapi/brivva-workers.json"
            echo "Run 'bun run contracts:gen-rust' locally and commit the result."
            exit 1
          fi

  server-rs:
    name: server-rs (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy (warnings are not fatal, zero dead code is)
        run: cargo clippy --all-targets -- -W dead_code -W unused -D warnings
        continue-on-error: false

      - name: cargo test
        run: cargo test --all-targets

  workers:
    name: workers (Cloudflare + D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run --cwd workers typecheck

      - name: vitest (unit + integration + e2e against in-memory D1)
        run: bun run --cwd workers test

  frontend:
    name: frontend (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run --cwd frontend typecheck

      - name: layer audit (CLAUDE.md §1.2 dependency rule)
        run: bun run --cwd frontend check:layers

      - name: vitest (component + reducer + message-handler tests)
        run: bun run --cwd frontend test

      - name: production build (smoke test vite can emit a bundle)
        run: bun run --cwd frontend build

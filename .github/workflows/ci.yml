name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

# Concurrency: a new push to the same branch cancels the in-flight run so
# CI never queues stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (generated types drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: regenerate Rust bindings from OpenAPI
        run: bun run contracts:gen-rust

      - name: fail if regeneration produced a diff
        run: |
          if ! git diff --exit-code server-rs/src/core/contracts/; then
            echo "::error::server-rs/src/core/contracts is out of sync with contracts/openapi/brivva-workers.json"
            echo "Run 'bun run contracts:gen-rust' locally and commit the result."
            exit 1
          fi

  server-rs:
    name: server-rs (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Workspace root is at repo root (Cargo.toml members=["server-rs"]);
          # Cargo.lock + target/ live there, not under server-rs/.
          workspaces: .
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod' }}

      - name: layer audit (CLAUDE.md §1.2 dependency rule)
        run: scripts/check-layers.sh

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy (warnings are not fatal, zero dead code is)
        run: cargo clippy --all-targets -- -W dead_code -W unused -D warnings
        continue-on-error: false

      - name: cargo test
        run: cargo test --all-targets

  workers:
    name: workers (Cloudflare + D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run --cwd workers typecheck

      - name: layer audit (CLAUDE.md §1.2 dependency rule)
        run: bun run --cwd workers check:layers

      - name: vitest (unit + integration + e2e against in-memory D1)
        run: bun run --cwd workers test

  frontend:
    name: frontend (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run --cwd frontend typecheck

      - name: layer audit (CLAUDE.md §1.2 dependency rule)
        run: bun run --cwd frontend check:layers

      - name: vitest with v8 coverage thresholds
        run: bun run --cwd frontend test:coverage

      - name: production build (smoke test vite can emit a bundle)
        run: bun run --cwd frontend build

  frontend-e2e:
    name: frontend e2e (Playwright + mock backend)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: run Playwright e2e (3 user-journey scenarios + host-session smoke)
        run: bun run --cwd frontend test:e2e
        env:
          CI: "true"

      - name: upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/**/trace.zip
          retention-days: 7

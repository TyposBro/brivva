name: server-image

# Builds the deployable server-rs image once per git SHA. Main pushes
# prebuild it; prod deploy calls this workflow and skips the build when
# that SHA tag already exists in ECR.

on:
  workflow_call:
    outputs:
      image:
        description: "Immutable ECR image tag for this commit"
        value: ${{ jobs.build-and-push.outputs.image }}
  workflow_dispatch:
  push:
    branches: [main, prod]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "server-rs/**"
      - "infra/server-build-base/**"
      - "infra/server-runtime-base/**"
      - "infra/ffmpeg-base/**"
      - ".github/workflows/server-image.yml"

concurrency:
  group: server-image-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build server-rs image if missing
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPO: brivva/server-rs
      FFMPEG_BASE_REPO: brivva/ffmpeg-base
      FFMPEG_VERSION: "7.1.1"
      SERVER_BUILD_BASE_REPO: brivva/server-build-base
      SERVER_BUILD_BASE_TAG: rust-1.88-slim-zigbuild-v1
      SERVER_RUNTIME_BASE_REPO: brivva/server-runtime-base
      SERVER_RUNTIME_BASE_TAG: bookworm-ffmpeg-7.1.1-v1
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/github-actions-deploy
          aws-region: us-east-1

      - name: Resolve image tag
        id: image
        run: echo "image=${ECR_REGISTRY}/${ECR_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check existing server image
        id: existing
        continue-on-error: true
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --region us-east-1 \
            --repository-name "${ECR_REPO}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt}' \
            --output table

      - name: Login to ECR
        if: steps.existing.outcome != 'success'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up buildx
        if: steps.existing.outcome != 'success'
        uses: docker/setup-buildx-action@v4

      - name: Verify base images exist
        if: steps.existing.outcome != 'success'
        run: |
          set -euo pipefail
          for image in \
            "${FFMPEG_BASE_REPO}:${FFMPEG_VERSION}-librtmp" \
            "${SERVER_BUILD_BASE_REPO}:${SERVER_BUILD_BASE_TAG}" \
            "${SERVER_RUNTIME_BASE_REPO}:${SERVER_RUNTIME_BASE_TAG}"
          do
            repo="${image%:*}"
            tag="${image##*:}"
            aws ecr describe-images \
              --region us-east-1 \
              --repository-name "$repo" \
              --image-ids imageTag="$tag" \
              --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt}' \
              --output table
          done

      # Native amd64 build: runner, Rust target, ffmpeg base, and final
      # image all share linux/amd64 so BuildKit never invokes QEMU.
      - name: Build and push server-rs
        if: steps.existing.outcome != 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server-rs/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SERVER_BUILD_BASE_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.SERVER_BUILD_BASE_REPO }}:${{ env.SERVER_BUILD_BASE_TAG }}
            SERVER_RUNTIME_BASE_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.SERVER_RUNTIME_BASE_REPO }}:${{ env.SERVER_RUNTIME_BASE_TAG }}
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-from: |
            type=gha,scope=server-rs
            type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=server-rs
            type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Verify server image
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --region us-east-1 \
            --repository-name "${ECR_REPO}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt}' \
            --output table

name: e2e-smoke

on:
  schedule:
    # 09:00 UTC daily. Post-deploy nightly signal for the full media pipeline.
    - cron: "0 9 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "server-rs/**"
      - "infra/ffmpeg-base/**"
      - "infra/server-build-base/**"
      - "infra/server-runtime-base/**"
      - "tests/e2e/**"
      - ".github/workflows/smoke.yml"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: media pipeline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: docker/setup-buildx-action@v3

      - name: build ffmpeg base
        uses: docker/build-push-action@v6
        with:
          context: infra/ffmpeg-base
          file: infra/ffmpeg-base/Dockerfile
          platforms: linux/amd64
          load: true
          tags: brivva-smoke-ffmpeg-base:local
          cache-from: type=gha,scope=smoke-ffmpeg-base
          cache-to: type=gha,mode=max,scope=smoke-ffmpeg-base

      - name: build server build base
        uses: docker/build-push-action@v6
        with:
          context: infra/server-build-base
          file: infra/server-build-base/Dockerfile
          platforms: linux/amd64
          load: true
          tags: brivva-smoke-server-build-base:local
          cache-from: type=gha,scope=smoke-server-build-base
          cache-to: type=gha,mode=max,scope=smoke-server-build-base

      - name: build server runtime base
        run: |
          docker build \
            --build-arg FFMPEG_BASE_IMAGE=brivva-smoke-ffmpeg-base:local \
            -t brivva-smoke-server-runtime-base:local \
            -f infra/server-runtime-base/Dockerfile \
            infra/server-runtime-base

      - name: build server image
        run: |
          docker build \
            --build-arg SERVER_BUILD_BASE_IMAGE=brivva-smoke-server-build-base:local \
            --build-arg SERVER_RUNTIME_BASE_IMAGE=brivva-smoke-server-runtime-base:local \
            -t brivva-smoke-server:local \
            -f server-rs/Dockerfile \
            .

      - name: build + start stack
        working-directory: tests/e2e
        run: |
          docker compose -f compose.e2e.yml build workers-stub soniox-stub elevenlabs-stub
          docker compose -f compose.e2e.yml up --no-build -d
          docker compose -f compose.e2e.yml ps

      - name: run smoke driver
        working-directory: tests/e2e
        env:
          SERVER_URL: http://localhost:3000
          WS_URL: ws://localhost:3000/api/session
          RTMP_URL: rtmp://localhost:1935/live/smoke-ja
          JWT_SECRET: smoke-jwt-secret
          SESSION_ID: SMOKE001
          USER_ID: smoke-user
        run: bun run smoke

      - name: dump server logs on failure
        if: failure()
        working-directory: tests/e2e
        run: docker compose -f compose.e2e.yml logs --tail=300

      - name: tear down
        if: always()
        working-directory: tests/e2e
        run: docker compose -f compose.e2e.yml down -v

name: e2e-smoke

on:
  schedule:
    # 09:00 UTC daily. Post-deploy nightly signal for the full media pipeline.
    - cron: "0 9 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "server-rs/**"
      - "infra/ffmpeg-base/**"
      - "infra/server-build-base/**"
      - "infra/server-runtime-base/**"
      - "tests/e2e/**"
      - ".github/workflows/smoke.yml"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    name: media pipeline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install e2e dependencies
        working-directory: tests/e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - uses: docker/setup-buildx-action@v4

      - name: build ffmpeg base
        uses: docker/build-push-action@v7
        with:
          context: infra/ffmpeg-base
          file: infra/ffmpeg-base/Dockerfile
          platforms: linux/amd64
          load: true
          tags: brivva-smoke-ffmpeg-base:local
          cache-from: type=gha,scope=smoke-ffmpeg-base
          cache-to: type=gha,mode=max,scope=smoke-ffmpeg-base

      - name: build server build base
        uses: docker/build-push-action@v7
        with:
          context: infra/server-build-base
          file: infra/server-build-base/Dockerfile
          platforms: linux/amd64
          load: true
          tags: brivva-smoke-server-build-base:local
          cache-from: type=gha,scope=smoke-server-build-base
          cache-to: type=gha,mode=max,scope=smoke-server-build-base

      - name: build server runtime base
        uses: docker/build-push-action@v7
        with:
          context: infra/server-runtime-base
          file: infra/server-runtime-base/Dockerfile
          platforms: linux/amd64
          load: true
          tags: brivva-smoke-server-runtime-base:local
          build-args: FFMPEG_BASE_IMAGE=brivva-smoke-ffmpeg-base:local
          cache-from: type=gha,scope=smoke-server-runtime-base
          cache-to: type=gha,mode=max,scope=smoke-server-runtime-base

      - name: build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server-rs/Dockerfile
          platforms: linux/amd64
          load: true
          tags: brivva-smoke-server:local
          build-args: |
            SERVER_BUILD_BASE_IMAGE=brivva-smoke-server-build-base:local
            SERVER_RUNTIME_BASE_IMAGE=brivva-smoke-server-runtime-base:local
          cache-from: type=gha,scope=smoke-server
          cache-to: type=gha,mode=max,scope=smoke-server

      - name: build + start stack
        working-directory: tests/e2e
        run: |
          docker compose -f compose.e2e.yml build workers-stub soniox-stub elevenlabs-stub
          docker compose -f compose.e2e.yml up --no-build -d
          docker compose -f compose.e2e.yml ps

      - name: run H.264 RTMP smoke
        working-directory: tests/e2e
        env:
          RTMP_URL: rtmp://localhost:1935/live/h264-copy-smoke
        run: bun run smoke:h264-copy

      - name: run browser WebRTC H.264 smoke
        working-directory: tests/e2e
        env:
          SERVER_URL: http://localhost:3000
          WS_URL: ws://localhost:3000/api/session
          RTMP_URL: rtmp://localhost:1935/live/smoke-ja
          JWT_SECRET: smoke-jwt-secret
          SESSION_ID: SMOKEWEBRTC001
          USER_ID: smoke-user
        run: bun run smoke:webrtc-h264

      - name: run smoke driver
        working-directory: tests/e2e
        env:
          SERVER_URL: http://localhost:3000
          WS_URL: ws://localhost:3000/api/session
          RTMP_URL: rtmp://localhost:1935/live/smoke-ja
          JWT_SECRET: smoke-jwt-secret
          SESSION_ID: SMOKE001
          USER_ID: smoke-user
        run: bun run smoke

      - name: assert media logs are clean
        if: always()
        working-directory: tests/e2e
        run: |
          docker compose -f compose.e2e.yml logs server > server.log
          docker compose -f compose.e2e.yml logs rtmp > rtmp.log
          bun run assert:media-logs server.log rtmp.log

      - name: dump server logs on failure
        if: failure()
        working-directory: tests/e2e
        run: docker compose -f compose.e2e.yml logs --tail=300

      - name: tear down
        if: always()
        working-directory: tests/e2e
        run: docker compose -f compose.e2e.yml down -v

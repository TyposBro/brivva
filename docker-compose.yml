name: brivva

services:
  server:
    build:
      context: .
      dockerfile: server-rs/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - STT_HOST=stt-wrapper
      - STT_PORT=8766
      - NLLB_HOST=nllb
      - KOKORO_HOST=kokoro
    depends_on:
      - nllb
      - stt-wrapper
      - kokoro
    restart: unless-stopped

  stt-wrapper:
    build: ./stt-wrapper
    ports:
      - "8766:8766"
    environment:
      - STT_HOST=whisper-stt
    depends_on:
      - whisper-stt
    restart: unless-stopped

  nllb:
    build: ./nllb
    ports:
      - "8000:8000"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped

  whisper-stt:
    build: ./whisper-stt
    ports:
      - "8765:8765"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped

  kokoro:
    build:
      context: ./kokoro
      dockerfile: docker/gpu/Dockerfile
    ports:
      - "8880:8880"
    runtime: nvidia
    environment:
      - PYTHONPATH=/app:/app/api
      - USE_GPU=true
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: ["bash", "-c", "python -m unidic download && ./entrypoint.sh"]
    restart: unless-stopped

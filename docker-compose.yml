name: brivva

services:
  server:
    build:
      context: .
      dockerfile: server-rs/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - STT_HOST=stt-wrapper
      - STT_PORT=8766
      - NLLB_HOST=nllb
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    depends_on:
      - nllb
      - stt-wrapper
    restart: unless-stopped

  stt-wrapper:
    build: ./stt-wrapper
    ports:
      - "8766:8766"
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - STT_LANGUAGE=en
    restart: unless-stopped

  nllb:
    build: ./nllb
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped

name: brivva

services:
  server:
    build:
      context: .
      dockerfile: server-rs/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - STT_HOST=stt-wrapper
      - STT_PORT=8766
      - NLLB_HOST=nllb
      - LIPSYNC_HOST=${LIPSYNC_HOST:-wav2lip}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    depends_on:
      - nllb
      - stt-wrapper
    restart: unless-stopped

  stt-wrapper:
    build: ./stt-wrapper
    ports:
      - "8766:8766"
    environment:
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_API_TOKEN=${CF_API_TOKEN}
      - STT_LANGUAGE=en
    restart: unless-stopped

  nllb:
    build: ./nllb
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped

  musetalk:
    build: ./musetalk
    ports:
      - "8101:8100"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    profiles: ["musetalk"]

  wav2lip:
    build: ./wav2lip
    ports:
      - "8100:8100"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    profiles: ["wav2lip"]

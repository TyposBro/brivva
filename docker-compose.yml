name: brivva

services:
  server:
    build:
      context: .
      dockerfile: server-rs/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - STT_HOST=stt-wrapper
      - STT_PORT=8766
      - NLLB_HOST=nllb
      - KOKORO_HOST=kokoro
    depends_on:
      - nllb
      - stt-wrapper
      - kokoro
    restart: unless-stopped

  stt-wrapper:
    build: ./stt-wrapper
    ports:
      - "8766:8766"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - STT_MODEL=small.en
      - STT_LANGUAGE=en
    restart: unless-stopped

  nllb:
    build: ./nllb
    ports:
      - "8000:8000"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped

  kokoro:
    build:
      context: ./kokoro
      dockerfile: docker/gpu/Dockerfile
    ports:
      - "8880:8880"
    runtime: nvidia
    environment:
      - PYTHONPATH=/app:/app/api
      - USE_GPU=true
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: >
      bash -c "
        DICDIR=/app/.venv/lib/python3.10/site-packages/unidic/dicdir;
        if [ -f /cache/unidic/matrix.bin ]; then
          echo 'UniDic: using cached copy';
          rm -rf $$DICDIR;
          cp -a /cache/unidic $$DICDIR;
        else
          python -m unidic download;
          mkdir -p /cache;
          cp -a $$DICDIR /cache/unidic;
        fi;
        ./entrypoint.sh
      "
    volumes:
      - unidic-cache:/cache
    restart: unless-stopped

volumes:
  unidic-cache:

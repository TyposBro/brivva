[package]
name = "server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
dashmap = "6.1.0"
futures-util = "0.3.32"
reqwest = { version = "0.13.2", features = ["json", "stream", "multipart", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.8", features = ["cors"] }
uuid = { version = "1.22.0", features = ["v4"] }
base64 = "0.22"
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
libc = "0.2"

[features]
# Exposes a small surface of test-only constructors (e.g.
# `RtmpManager::insert_test_target_stream`) so integration tests under
# `tests/` can wire fake streams without spawning real FFmpeg children.
# Production builds never enable this; the feature is gated to keep the
# normal binary surface free of test-only API.
test-helpers = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
dashmap = "6.1.0"

[[test]]
name = "caption_burn_in"
path = "tests/caption_burn_in.rs"
required-features = ["test-helpers"]

[package]
name = "server-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "server_rs"
path = "src/lib.rs"

[[bin]]
name = "server-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22"
dashmap = "6.1.0"
dotenvy = "0.15"
futures-util = "0.3.32"
reqwest = { version = "0.13.2", features = ["json", "stream", "multipart", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
tower-http = { version = "0.6.8", features = ["cors"] }
uuid = { version = "1.22.0", features = ["v4"] }

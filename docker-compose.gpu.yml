# GPU override — use with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# NOTE: NLLB on GPU when using Wav2Lip (lighter VRAM). For MuseTalk, consider running NLLB on CPU.
services:
  nllb:
    build:
      context: ./nllb
      dockerfile: Dockerfile.gpu
    runtime: nvidia

  musetalk:
    runtime: nvidia

  wav2lip:
    runtime: nvidia
